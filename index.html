<!-- Loaded as non-render-blocking: the browser won't paint anything until a
     normal <link rel="stylesheet"> finishes loading, which was holding up
     first paint (and thus the loading placeholder below) behind a
     third-party font fetch. Loading it as "print" media first (so it
     doesn't block) then switching to "all" once it arrives keeps the font
     but stops it from gating when the page can first show something. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<style>
  :root, [data-theme="original"]{
    --bg:#F3F7FC; --panel:#FFFFFF; --panel2:#EEF5FB;
    --line:#E4EEF8; --lineS:#CFE1F3;
    --text:#2B2A3A; --dim:#8A8CA0; --faint:#BFC6D6;
    --brass:#FF9EC7; --brassDim:#F17FB2;
    --gray:#AACBE6; --paleblue:#BFE6FA;
    --teal:#4FAE72; --rust:#E8746B; --blue:#7FB3DC;
    --ink:#2B2A3A; --pix:2px; --sh:3px;
  }
  [data-theme="mono"]{
    --bg:#F1F1F1; --panel:#FFFFFF; --panel2:#E9E9E9;
    --line:#DEDEDE; --lineS:#C4C4C4;
    --text:#242424; --dim:#8C8C8C; --faint:#BDBDBD;
    --brass:#4B4B4B; --brassDim:#2C2C2C;
    --gray:#B3B3B3; --paleblue:#D9D9D9;
    --teal:#4E4E4E; --rust:#3A3A3A; --blue:#6E6E6E;
    --ink:#242424; --pix:2px; --sh:3px;
  }
  [data-theme="dark"]{
    --bg:#17171D; --panel:#1E1E25; --panel2:#26262F;
    --line:#34343E; --lineS:#4B4B57;
    --text:#ECECF0; --dim:#9C9CA8; --faint:#64646F;
    --brass:#D9D9DE; --brassDim:#B7B7BF;
    --gray:#8A8A94; --paleblue:#3A3A44;
    --teal:#CFCFD4; --rust:#77777F; --blue:#9C9CA8;
    --ink:#ECECF0; --pix:2px; --sh:3px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'DotGothic16',sans-serif; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .pixnum{font-family:'Press Start 2P',monospace;}
  #app{max-width:880px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 16px 90px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
 .eyebrow {
    display: flex;
    align-items: baseline; /* 文字の底辺を揃える */
    gap: 3px; /* 名前とTIMECARDの隙間 */
    margin-bottom: 0;
    color: var(--brass);
    text-shadow: 2px 2px 0 var(--lineS);
  }
 .user-name-part {
    font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
    font-size: 15px; /* 英語の時はTIMECARDと同じサイズ */
    letter-spacing: 2px
  }
  /* ▼ 日本語が含まれている時 */
  .user-name-part.is-ja {
    font-size: 16px; /* 日本語は少し大きく */
    position: relative;
    font-weight: 700;
    top: -3px; /* 日本語だけ上に持ち上げる */
  }
  .fixed-part {
    font-family: 'Press Start 2P', monospace; /* ←元の極太レトロフォント */
    font-size: 15px;
    letter-spacing: 2px;
  }
  .panel{background:var(--panel); border:var(--pix) solid var(--lineS); border-radius:16px; box-shadow: var(--sh) var(--sh) 0 var(--line);}
  nav{display:flex; gap:6px; margin-bottom:18px;}
  nav button{padding:9px 6px; background:var(--panel2); cursor:pointer; color:var(--dim); font-size:11px; font-weight:600; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:5px; border:2px solid var(--lineS); border-radius:10px; box-shadow:2px 2px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease; flex:1;}
  nav button.active{color:#fff; background:var(--brass); border-color:var(--brassDim);}
  nav button:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--line);}
  /* タブ切り替え時の軽量な演出。transform/opacityのみのCSSアニメーションなので
     毎フレームのJS計算は発生せず、起動速度やスクロール性能への影響はごく小さい。 */
  @keyframes tabSlideFwd{ from{opacity:0; transform:translateX(14px);} to{opacity:1; transform:translateX(0);} }
  @keyframes tabSlideBack{ from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:translateX(0);} }
  #tabcontent.tab-slide-fwd{ animation:tabSlideFwd .2s cubic-bezier(.22,.61,.36,1); }
  #tabcontent.tab-slide-back{ animation:tabSlideBack .2s cubic-bezier(.22,.61,.36,1); }
  @media (prefers-reduced-motion: reduce){
    #tabcontent.tab-slide-fwd, #tabcontent.tab-slide-back{ animation:none; }
  }
  .status-dot{display:inline-flex; align-items:center; gap:8px;}
  .status-dot .dot{width:9px; height:9px; border-radius:3px;}
  select,input{width:100%; background:var(--panel2); border:2px solid var(--lineS); border-radius:9px; color:var(--text); padding:9px 10px; font-size:14px; font-family:inherit;}
  .card-punch{padding:22px; position:relative; overflow:hidden; margin-bottom:16px;}
  .clock{text-align:center; font-size:34px; font-weight:700; letter-spacing:1px; margin:6px 0 4px; font-family:'Press Start 2P',monospace; color:var(--text);}
  .goalline{text-align:center; font-size:11px; color:var(--dim); margin-bottom:14px; font-family:'JetBrains Mono',monospace;}
  .btnrow{display:flex; gap:10px;}
  .bigbtn{flex:1; padding:16px 4px; border-radius:14px; cursor:pointer; font-family:inherit; font-size:15px; font-weight:700; border:2px solid var(--lineS); box-shadow:3px 3px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease;}
  .bigbtn:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--line);}
  .bigbtn.primary{background:var(--brass); color:#fff; border-color:var(--brassDim); box-shadow:3px 3px 0 rgba(255,158,199,0.4);}
  .bigbtn.secondary{background:var(--panel); color:var(--dim);}
  .bigbtn.pale{background:var(--paleblue); color:var(--text); border-color:#8FCBEA;}
  .projlist{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0;}
  .projchip{display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px; background:var(--panel2); border:2px solid var(--lineS); font-size:12px; font-weight:600; color:var(--text); cursor:pointer; box-shadow:2px 2px 0 var(--line);}
  .projchip .sq{width:9px; height:9px; border-radius:3px; flex-shrink:0;}
  .projchip.selected{border-color:var(--brassDim); box-shadow:2px 2px 0 rgba(255,158,199,0.35);}
  .projchip.running{color:#fff; box-shadow:2px 2px 0 var(--line);}
  .projchip.grayout{opacity:0.4;}
  .progresswrap{position:relative; margin:45px 0 7px;}
  .progresstrack{height:14px; background:var(--panel2); border-radius:999px; border:2px solid var(--lineS); overflow:hidden;}
  .progressfill{height:100%; background:var(--brass); border-radius:999px; transition:width .3s steps(3);}
  .catwalk{position:absolute; top:-37px; transform:translateX(-30%); transition:left .3s steps(3); z-index:4;}
  .catwalk.stretch-idle{top:0; transform:translateX(-8%);}
  .catwalk.walking{animation:catBob 0.5s steps(2) infinite;}
  /* ---- "stretch" bar style: cat's rear stays anchored at the start, its
     head leads and advances with progress, and the body between them
     stretches to fill the gap -- no separate pill-shaped track underneath.
     The mid segment has a gentle continuous "breathing" pulse so the
     elasticity always reads clearly, even when idle. ---- */
  .progresswrap.stretch{margin:18px 0 18px; height:40px;}
  .stretchbar{position:relative; width:100%;}
  .stretchbar-back{position:absolute; top:0; filter:drop-shadow(1px 1px 0 var(--lineS));}
  .stretchbar-goal{position:absolute; top:0; transform:translateX(-50%) scale(0.8); transform-origin:center; z-index:0; opacity:0.9;}
  /* The not-yet-reached fish should draw in front of the cat (instead of
     being covered by its head as it stretches in close) so it stays clearly
     visible right up to 100%. The "done" marker (eaten fish/bone) keeps the
     base stacking. */
  .stretchbar-goal[data-goal-state="fish"]{z-index:3;}
  .stretchbar-back{transition:left .35s steps(3); z-index:2;}
  .stretchbar-back.working{animation:stretchTug 1.2s steps(3) infinite;}
  /* Idle "alive" twitch for the not-yet-reached fish -- an irregular
     twitch/twitch, pause, twitch, pause, twitch/twitch pattern rather than a
     steady loop, so it reads as a little fish waiting rather than a
     mechanical wobble. Only applies in the "fish" state; the achieved bone
     stays still. */
  @keyframes fishTwitch{
    0%, 100%{ transform:translateX(-50%) scale(0.8) rotate(0deg); }
    4%{ transform:translateX(-50%) scale(0.82) rotate(-8deg); }
    8%{ transform:translateX(-50%) scale(0.8) rotate(6deg); }
    12%{ transform:translateX(-50%) scale(0.8) rotate(0deg); }
    38%{ transform:translateX(-50%) scale(0.8) rotate(0deg); }
    42%{ transform:translateX(-50%) scale(0.82) rotate(-7deg); }
    46%{ transform:translateX(-50%) scale(0.8) rotate(0deg); }
    64%{ transform:translateX(-50%) scale(0.8) rotate(0deg); }
    68%{ transform:translateX(-50%) scale(0.82) rotate(8deg); }
    71%{ transform:translateX(-50%) scale(0.8) rotate(-5deg); }
    74%{ transform:translateX(-50%) scale(0.8) rotate(0deg); }
  }
  .stretchbar-goal[data-goal-state="fish"]{ animation:fishTwitch 4.5s ease-in-out infinite; }
  /* Played once at the instant the fish flips to the "done" bone marker, so
     hitting the goal reads as: fish grows, bounces, *then* becomes the bone
     (the JS delays the actual sprite swap until partway through this
     animation -- see playGoalPop). Scaled down from an earlier pass that
     overshot too big. This rule is intentionally listed after the fish
     twitch rule so it wins the tie in specificity while the pop plays. */
  @keyframes goalPop{
    0%{ transform:translateX(-50%) scale(0.8); }
    30%{ transform:translateX(-50%) scale(0.9); }
    45%{ transform:translateX(-50%) scale(0.85); }
    65%{ transform:translateX(-50%) scale(0.8); }
    82%{ transform:translateX(-50%) scale(0.92); }
    100%{ transform:translateX(-50%) scale(0.8); }
  }
  .stretchbar-goal.goal-pop{ animation:goalPop .5s cubic-bezier(.34,1.56,.64,1); }
  @media (prefers-reduced-motion: reduce){
    .stretchbar-goal[data-goal-state="fish"]{ animation:none; }
    .stretchbar-goal.goal-pop{ animation:none; }
  }
  .stretchbar-front{position:absolute; top:0; z-index:1;}
  .stretchbar-mid{position:absolute; transition:width .35s steps(3); image-rendering:pixelated; transform-origin:left center; z-index:0;}
  @keyframes stretchTug{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(2px);} }
  .punchbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 4px; border-radius:12px; cursor:pointer; background:var(--panel2); border:2px solid var(--lineS); color:var(--dim); font-family:inherit; box-shadow:2px 2px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease;}
  .punchbtn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--line);}
  .punchbtn.active{background:var(--c,var(--brass)); background:color-mix(in srgb, var(--c,var(--brass)) 20%, var(--panel)); border-color:var(--c,var(--brass)); color:var(--c,var(--brass));}
  .punchbtn:disabled{opacity:.4; cursor:default; box-shadow:none; transform:none;}
  .punchbtn svg{width:18px; height:18px;}
  .punchbtn span{font-size:11px; font-weight:600;}
  .metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .metric{background:var(--panel2); border-radius:10px; padding:10px 12px; border:2px solid var(--lineS); box-shadow:2px 2px 0 var(--line);}
  .metric .lbl{font-size:10px; color:var(--dim); margin-bottom:4px;}
  .metric .val{font-size:14px; font-weight:700; font-family:'JetBrains Mono',monospace;}
  .seg{font-size:12px; color:var(--dim); margin-bottom:4px; display:flex; gap:8px;}
  .banner{padding:14px; margin-bottom:16px; border:var(--pix) solid var(--rust); border-radius:14px; background:var(--panel); box-shadow: var(--sh) var(--sh) 0 rgba(232,116,107,0.18);}
  .toast{position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:100; padding:12px 20px; border-radius:12px; background:var(--brass); color:#fff; border:2px solid var(--brassDim); box-shadow:3px 3px 0 rgba(255,158,199,0.4); font-size:13px; font-weight:700; white-space:nowrap; animation:toastIn .25s ease;}
  @keyframes toastIn{ from{opacity:0; transform:translateX(-50%) translateY(-10px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
  .locrow{padding:14px; margin-bottom:12px;}
  .loc-name{font-weight:700; font-size:15px;}
  .dot-sm{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:6px;}
  .icobtn {display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 32px; padding: 0; margin: 0; background: var(--panel2); border: 2px solid var(--lineS); border-radius: 8px; color: var(--dim); cursor: pointer; box-shadow: 2px 2px 0 var(--line); font-size: 12px; font-family: 'Press Start 2P', monospace; }  
  .field{margin-bottom:12px;}
  .field label{font-size:11px; color:var(--dim); display:block; margin-bottom:5px;}
  .days-picker{display:flex; gap:6px; flex-wrap:wrap;}
  .day-chip{width:32px; height:32px; border-radius:9px; border:2px solid var(--lineS); background:var(--panel2); color:var(--dim); cursor:pointer; font-size:12px; box-shadow:2px 2px 0 var(--line);}
  .day-chip.on{border-color:var(--brassDim); background:var(--brass); color:#fff; box-shadow:1px 1px 0 var(--line); transform:translate(1px,1px);}
  .swatch-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:30px; height:30px; border-radius:999px; cursor:pointer; border:2.5px solid var(--panel); box-shadow:0 0 0 2px var(--lineS); display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;}
  .swatch.on{box-shadow:0 0 0 2px var(--brassDim);}
  .modal-bg{position:fixed; inset:0; background:rgba(43,42,58,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--panel); border-radius:18px 18px 0 0; padding:20px; width:100%; max-width:480px; border:var(--pix) solid var(--lineS); border-bottom:none; padding-bottom:calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -3px 0 var(--line); max-height:86vh; overflow-y:auto;}
  .btn-primary{flex:1; padding:11px 0; border-radius:10px; background:var(--brass); border:2px solid var(--brassDim); color:#fff; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:3px 3px 0 rgba(255,158,199,0.35);}
  .btn-primary:active{transform:translate(3px,3px); box-shadow:0 0 0 rgba(255,158,199,0.35);}
    .btn-ghost {
        flex: 1;
        padding: 11px 0;
        border-radius: 10px;
        background: var(--panel2);
        border: 2px solid var(--lineS);
        color: var(--dim);
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 3px 3px 0 var(--line);
    }  .btn-ghost:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--line);}
  .navbtn{background:var(--panel2); border:2px solid var(--lineS); color:var(--text); width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:16px; box-shadow:2px 2px 0 var(--line);}
  .navbtn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--line);}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th{padding:10px 8px; font-weight:700; border-bottom:2px solid var(--lineS); color:var(--dim); text-align:left; white-space:nowrap;}
  td{padding:8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  .tbl-wrap{overflow-x:auto;}
  .barrow{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12px;}
  .barrow .lbl{width:88px; flex-shrink:0; color:var(--dim); overflow:hidden; text-overflow:ellipsis;}
  .barrow .bar{height:10px; border-radius:5px;}
  .barwrap{flex:1; background:var(--panel2); border-radius:5px; overflow:hidden; display:flex; height:10px; border:1.5px solid var(--lineS);}
  .stackbar{display:flex; width:100%; height:22px; border-radius:11px; overflow:hidden; border:2px solid var(--lineS); background:var(--panel2);}
  .empty{padding:24px; text-align:center; color:var(--faint); font-size:13px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-head{font-size:10px; color:var(--dim); text-align:center; padding-bottom:6px; font-family:'JetBrains Mono',monospace; font-weight:700;}
  .cal-cell{background:var(--panel2); border-radius:9px; padding:5px 4px; min-height:58px; display:flex; flex-direction:column; gap:2px; border:2px solid var(--line); cursor:pointer; transition:transform .08s ease, box-shadow .08s ease;}
  .cal-cell.blank{background:none; border-color:transparent; cursor:default;}
  /* 当日：枠は標準色で、背景だけ薄ピンクにする */
    .cal-cell.today {
        border-color: color-mix(in srgb, var(--brass) 30%, var(--panel));
        background: color-mix(in srgb, var(--brass) 14%, var(--panel));
        box-shadow: none;
    }  /* 選択中：背景は標準色（薄い青）で、枠と影だけピンクにする */
  .cal-cell.selected {
        border-color: var(--brassDim);
        background: var(--panel2);
        box-shadow: 2px 2px 0 rgba(255,158,199,0.4);
    }
  /* 当日かつ選択中：薄ピンクの背景＋ピンクの枠 */
  .cal-cell.selected.today {
        border-color: var(--brassDim);
        background: color-mix(in srgb, var(--brass) 14%, var(--panel));
        box-shadow: 2px 2px 0 rgba(255,158,199,0.45);
  }  
  .cal-cell:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--line);}
  .cal-day{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--faint);}
  .cal-hrs{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--text);}
  .cal-ach{font-family:'JetBrains Mono',monospace; font-size:9px;}
  .cal-star, .cal-gift{font-size:9px; margin-left:2px;}
  .cal-dots{display:flex; gap:2px; flex-wrap:wrap;}
  .cal-dot{width:6px; height:6px; border-radius:2px;}
  input[type=number]::-webkit-inner-spin-button{opacity:.5;}
  ::-webkit-scrollbar{height:6px; width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--lineS); border-radius:4px;}
  @keyframes catBob{ 0%,100%{transform:translateX(-30%) translateY(0);} 50%{transform:translateX(-30%) translateY(-3px);} }
  .pixrow{display:grid; grid-template-columns:repeat(5, 1fr); gap:5px; padding-bottom:2px;}
  .pixcard{display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px; border-radius:10px; background:var(--panel); border:2px solid var(--lineS); cursor:pointer; box-shadow:2px 2px 0 var(--line); min-width:0;}
  .pixcard.on{border-color:var(--brassDim); box-shadow:2px 2px 0 rgba(255,158,199,0.35);}
  .pixcard .name{font-size:10px; font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .settitle{font-weight:700; font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:6px;}
  .themecard{display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:12px; border:2px solid var(--lineS); cursor:pointer; flex:1; min-width:100px; box-shadow:2px 2px 0 var(--line);}
  .themecard.on{border-color:var(--brassDim); box-shadow:2px 2px 0 rgba(255,158,199,0.35);}
  .themecard .swrow{display:flex; gap:4px;}
  .themecard .sw{width:16px; height:16px; border-radius:4px; border:1px solid rgba(0,0,0,0.08);}
  .themecard .name{font-size:11px; font-weight:600; color:var(--text);}
  .installsteps{font-size:12px; color:var(--dim); line-height:1.9; margin:0; padding-left:18px;}
  .installsteps li{margin-bottom:2px;}
  .collapsehead{display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:4px 0;}
  .collapsehead .tri{font-size:10px; color:var(--faint); transition:transform .15s ease;}
  .collapsebody{margin-top:10px;}
  .howto-page{margin-bottom:10px;}
  .howto-page .pname{font-weight:700; font-size:12px; margin-bottom:2px;}
  .howto-page .pdesc{font-size:12px; color:var(--dim); line-height:1.6;}
